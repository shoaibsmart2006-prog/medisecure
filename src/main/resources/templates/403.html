<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Access Denied - MediSecure</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #f8fafc, #e2e8f0);
            font-family: 'Segoe UI', sans-serif;
        }

        .main-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .error-card {
            width: 1000px;
            max-width: 100%;
            background: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
            display: flex;
        }

        .left-panel {
            width: 50%;
            background: linear-gradient(160deg, #0f172a, #1d4ed8);
            color: white;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left-panel h1 {
            font-size: 5rem;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .left-panel p {
            font-size: 1.2rem;
            opacity: 0.95;
        }

        .right-panel {
            width: 50%;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
        }

        .error-image {
            width: 260px;
            margin: 0 auto 25px auto;
        }

        .btn-home {
            border-radius: 14px;
            padding: 14px 28px;
            font-weight: 600;
        }

        @media (max-width: 900px) {
            .error-card {
                flex-direction: column;
            }

            .left-panel,
            .right-panel {
                width: 100%;
                text-align: center;
            }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="error-card">

        <div class="left-panel">
            <h1>403</h1>

            <p>
                This area is restricted.
                MediSecure protects patient and provider access using secure role-based authentication.
            </p>
        </div>

        <div class="right-panel">
            <img src="/images/access-denied.png" alt="Access Denied" class="error-image">

            <h2 class="fw-bold mb-3">Access Denied</h2>

            <p class="text-muted mb-4">
                You do not have permission to access this page.
            </p>

            <a href="/" class="btn btn-primary btn-home">
                Return Home
            </a>
        </div>

    </div>
</div>

</body>
</html>
