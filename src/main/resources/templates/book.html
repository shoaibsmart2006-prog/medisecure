<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>MediSecure - Book Appointment</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef4ff, #ffffff);
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            padding: 18px 0;
        }

        .booking-wrapper {
            min-height: calc(100vh - 90px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 50px;
        }

        .booking-card {
            width: 1200px;
            max-width: 100%;
            background: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.10);
            display: flex;
        }

        .left-panel {
            width: 50%;
            background: linear-gradient(160deg, #0f172a, #1d4ed8);
            color: white;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left-panel h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .left-panel p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        .booking-image {
            width: 280px;
            margin: 35px auto;
            display: block;
        }

        .info-box {
            padding: 20px;
            background: rgba(255,255,255,0.12);
            border-radius: 20px;
            margin-top: 20px;
        }

        .right-panel {
            width: 50%;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-title {
            text-align: center;
            font-weight: 800;
            color: #0f172a;
            margin-bottom: 30px;
        }

        .form-control {
            border-radius: 14px;
            padding: 12px;
        }

        .btn-primary {
            border-radius: 14px;
            padding: 14px;
            font-weight: 600;
        }

        .success-message {
            text-align: center;
            margin-top: 20px;
            font-weight: 700;
        }

        @media (max-width: 900px) {
            .booking-card {
                flex-direction: column;
            }

            .left-panel,
            .right-panel {
                width: 100%;
            }

            .left-panel {
                text-align: center;
            }
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary fs-3" href="/">MediSecure</a>

        <div class="d-flex align-items-center gap-2">
            <a class="btn btn-outline-dark" href="/patient">Dashboard</a>

            <form action="/logout" method="post" style="display:inline;">
                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />
                <button type="submit" class="btn btn-primary">
                    Logout
                </button>
            </form>
        </div>
    </div>
</nav>

<div class="booking-wrapper">
    <div class="booking-card">

        <div class="left-panel">
            <h1>Book Your Appointment</h1>

            <p>
                Schedule secure consultations with healthcare providers
                through the MediSecure patient portal.
            </p>

            <img src="/images/appointment.png"
                 alt="Appointment Booking"
                 class="booking-image">

            <div class="info-box">
                <p>✔ Secure healthcare scheduling</p>
                <p>✔ Real-time appointment requests</p>
                <p>✔ Protected patient portal access</p>
                <p>✔ Professional provider coordination</p>
            </div>
        </div>

        <div class="right-panel">
            <h2 class="form-title">Appointment Request</h2>

            <form th:action="@{/book}" method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />

                <div class="mb-3">
                    <label class="form-label">Doctor Name</label>
                    <input type="text"
                           name="doctorName"
                           class="form-control"
                           placeholder="Enter doctor's full name"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Reason for Visit</label>
                    <input type="text"
                           name="reason"
                           class="form-control"
                           placeholder="Consultation reason"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Appointment Date</label>
                    <input type="date"
                           name="date"
                           class="form-control"
                           required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Appointment Time</label>
                    <input type="time"
                           name="time"
                           class="form-control"
                           required>
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Submit Appointment Request
                </button>
            </form>

            <div class="success-message text-success">
                <p th:text="${message}"></p>
            </div>
        </div>

    </div>
</div>

</body>
</html>
