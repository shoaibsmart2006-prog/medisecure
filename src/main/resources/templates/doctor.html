<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>MediSecure - Doctor Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #eef4ff, #ffffff);
            font-family: 'Segoe UI', sans-serif;
        }

        .navbar {
            padding: 18px 0;
        }

        .hero-card {
            border: none;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            overflow: hidden;
            background: white;
        }

        .hero-left {
            padding: 50px;
        }

        .hero-left h1 {
            font-size: 2.8rem;
            font-weight: 800;
            color: #0f172a;
        }

        .hero-left p {
            font-size: 1.1rem;
            color: #64748b;
        }

        .hero-image {
            width: 280px;
        }

        .stat-card {
            border: none;
            border-radius: 24px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.06);
            padding: 25px;
            text-align: center;
            background: white;
        }

        .stat-card h3 {
            font-size: 2rem;
            font-weight: 800;
            color: #2563eb;
        }

        .appointments-card {
            border: none;
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            background: white;
            padding: 35px;
        }

        textarea {
            min-height: 100px;
            border-radius: 12px;
        }

        .btn-danger,
        .btn-success {
            border-radius: 12px;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary fs-3" href="/">MediSecure</a>

        <form action="/logout" method="post" style="display:inline;">
            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />
            <button type="submit" class="btn btn-outline-dark">
                Logout
            </button>
        </form>
    </div>
</nav>

<div class="container py-5">

    <div class="hero-card mb-5">
        <div class="row align-items-center">

            <div class="col-md-7 hero-left">
                <h1>Doctor Dashboard</h1>

                <h4 class="text-primary fw-bold mt-3" th:text="${doctorName}"></h4>

                <p class="mt-3">
                    Manage appointments and maintain secure patient notes.
                </p>
            </div>

            <div class="col-md-5 text-center p-4">
                <img src="/images/doctor-office.png"
                     alt="Doctor Dashboard"
                     class="hero-image">
            </div>

        </div>
    </div>

    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="stat-card">
                <h3 th:text="${appointments != null ? appointments.size() : 0}"></h3>
                <p class="text-muted mb-0">Scheduled Appointments</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="stat-card">
                <h3>DOCTOR</h3>
                <p class="text-muted mb-0">Account Type</p>
            </div>
        </div>

        <div class="col-md-4">
            <div class="stat-card">
                <h3>LIVE</h3>
                <p class="text-muted mb-0">Schedule Management</p>
            </div>
        </div>
    </div>

    <div class="appointments-card">

        <div th:if="${message}" class="alert alert-success text-center">
            <span th:text="${message}"></span>
        </div>

        <h2 class="fw-bold mb-4">Patient Appointments</h2>

        <div th:if="${appointments != null and !appointments.isEmpty()}">

            <div th:each="appointment : ${appointments}" class="card mb-4 shadow-sm">
                <div class="card-body">

                    <h5 class="fw-bold" th:text="${appointment.patient.name}"></h5>

                    <p>
                        <strong>Reason:</strong>
                        <span th:text="${appointment.reason}"></span>
                    </p>

                    <p>
                        <strong>Date:</strong>
                        <span th:text="${appointment.appointmentDate}"></span>
                        |
                        <strong>Time:</strong>
                        <span th:text="${appointment.appointmentTime}"></span>
                    </p>

                    <form th:action="@{/doctor/notes}" method="post" class="mb-3">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}" />

                        <input type="hidden"
                               name="appointmentId"
                               th:value="${appointment.id}" />

                        <label class="form-label fw-bold">Doctor Notes</label>

                        <textarea name="doctorNotes"
                                  class="form-control"
                                  th:text="${appointment.doctorNotes}"
                                  placeholder="Enter patient notes here..."></textarea>

                        <button type="submit" class="btn btn-success mt-3">
                            Save Notes
                        </button>
                    </form>

                    <form th:action="@{/doctor/cancel}" method="post">
                        <input type="hidden"
                               th:name="${_csrf.parameterName}"
                               th:value="${_csrf.token}" />

                        <input type="hidden"
                               name="appointmentId"
                               th:value="${appointment.id}" />

                        <button type="submit" class="btn btn-danger">
                            Cancel Appointment
                        </button>
                    </form>

                </div>
            </div>

        </div>

        <div th:if="${appointments == null or appointments.isEmpty()}">
            <p class="text-center text-muted fs-5 mt-4">
                No scheduled appointments yet.
            </p>
        </div>

    </div>

</div>

</body>
</html>
