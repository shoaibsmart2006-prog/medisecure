<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>MediSecure - Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #eef4ff, #ffffff);
            font-family: 'Segoe UI', sans-serif;
        }

        .main-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .signup-wrapper {
            width: 1150px;
            max-width: 100%;
            background: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
            display: flex;
        }

        .left-panel {
            width: 50%;
            background: linear-gradient(160deg, #0f172a, #1d4ed8);
            color: white;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .left-panel h1 {
            font-size: 3rem;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .left-panel p {
            font-size: 1.1rem;
            opacity: 0.95;
        }

        .doctor-image {
            width: 260px;
            margin: 35px auto;
            display: block;
        }

        .feature-box {
            margin-top: 20px;
            padding: 20px;
            background: rgba(255,255,255,0.12);
            border-radius: 20px;
        }

        .right-panel {
            width: 50%;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-title {
            text-align: center;
            color: #0f172a;
            font-weight: 800;
            margin-bottom: 30px;
        }

        .btn-primary {
            border-radius: 14px;
            padding: 14px;
            font-weight: 600;
        }

        .form-control,
        .form-select {
            border-radius: 14px;
            padding: 12px;
        }

        #doctorKeySection {
            display: none;
        }

        @media (max-width: 900px) {
            .signup-wrapper {
                flex-direction: column;
            }

            .left-panel,
            .right-panel {
                width: 100%;
            }

            .left-panel {
                text-align: center;
            }
        }
    </style>
</head>
<body>

<div class="main-container">
    <div class="signup-wrapper">

        <div class="left-panel">
            <h1>Join MediSecure</h1>

            <p>
                Create your secure healthcare account and start managing
                appointments with confidence.
            </p>

            <img src="/images/male-doctor.png" alt="Doctor" class="doctor-image">

            <div class="feature-box">
                <p>✔ Secure patient & provider accounts</p>
                <p>✔ Fast appointment scheduling</p>
                <p>✔ Protected healthcare access</p>
                <p>✔ Modern healthcare portal experience</p>
            </div>
        </div>

        <div class="right-panel">
            <h2 class="form-title">Create Your Account</h2>

            <div th:if="${message}" class="alert alert-danger text-center">
                <span th:text="${message}"></span>
            </div>

            <form th:action="@{/signup}" method="post">

                <input type="hidden"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}" />

                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text"
                           name="name"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input type="email"
                           name="email"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password"
                           name="password"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Account Type</label>
                    <select name="role" class="form-select" id="roleSelect" required>
                        <option value="">Select Role</option>
                        <option value="PATIENT">Patient</option>
                        <option value="DOCTOR">Doctor</option>
                    </select>
                </div>

                <div class="mb-4" id="doctorKeySection">
                    <label class="form-label">Doctor Access Key</label>
                    <input type="password"
                           name="doctorKey"
                           class="form-control"
                           placeholder="Enter doctor access key">
                </div>

                <button type="submit" class="btn btn-primary w-100">
                    Create Account
                </button>
            </form>

            <div class="text-center mt-4">
                <p>Already have an account?</p>
                <a href="/login" class="btn btn-outline-dark">
                    Sign In
                </a>
            </div>
        </div>

    </div>
</div>

<script>
    const roleSelect = document.getElementById("roleSelect");
    const doctorKeySection = document.getElementById("doctorKeySection");

    roleSelect.addEventListener("change", function() {
        if (this.value === "DOCTOR") {
            doctorKeySection.style.display = "block";
        } else {
            doctorKeySection.style.display = "none";
        }
    });
</script>

</body>
</html>
